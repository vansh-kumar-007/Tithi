{% extends "base.html" %}
{% block title %}Error — Hindu Tithi Calculator{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="error-page">
    <div class="error-icon">⚠️</div>
    <h1>{{ code }} — {{ error }}</h1>
    <p class="text-muted">Something went wrong. Please go back and try again.</p>
    <a href="/" class="btn btn-saffron mt-3"><i class="fas fa-home me-2"></i>Back to Calculator</a>
  </div>
</div>
{% endblock %}
